<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connecting Strava — Devotion.Run</title>

    <!-- SEO -->
    <meta name="description" content="Strava OAuth callback endpoint for Devotion.Run.">
    <meta name="robots" content="noindex, nofollow">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../styles.css">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✝️</text></svg>">

    <style>
        .callback-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .callback-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 48px;
            max-width: 480px;
            width: 100%;
        }

        .callback-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-glow);
            border: 1px solid var(--border-gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 24px;
        }

        .callback-card h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        .callback-card p {
            color: var(--text-secondary);
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .callback-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border-subtle);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        .callback-error {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
        }

        .callback-success {
            color: #22c55e;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: var(--radius-md);
            padding: 16px;
            margin-bottom: 24px;
        }
    </style>
</head>

<body>
    <div class="callback-page">
        <div class="callback-card" id="callbackCard">
            <div class="callback-icon" id="callbackIcon">🏃</div>
            <h1 id="callbackTitle">Connecting Strava...</h1>
            <p id="callbackMessage">Please wait while we complete the connection.</p>
            <div class="callback-spinner" id="callbackSpinner"></div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');
            const state = params.get('state');

            const card = document.getElementById('callbackCard');
            const icon = document.getElementById('callbackIcon');
            const title = document.getElementById('callbackTitle');
            const message = document.getElementById('callbackMessage');
            const spinner = document.getElementById('callbackSpinner');

            function showSuccess(text) {
                spinner.style.display = 'none';
                icon.textContent = '✓';
                title.textContent = 'Strava Connected';
                message.innerHTML = text;
                message.className = 'callback-success';
            }

            function showError(text) {
                spinner.style.display = 'none';
                icon.textContent = '✕';
                title.textContent = 'Connection Failed';
                message.innerHTML = text;
                message.className = 'callback-error';

                const retryBtn = document.createElement('a');
                retryBtn.href = '/strava/';
                retryBtn.className = 'btn-primary';
                retryBtn.textContent = 'Try Again';
                retryBtn.style.marginTop = '16px';
                card.appendChild(retryBtn);
            }

            // Build deep link back to the app
            const deepLinkParams = new URLSearchParams();
            if (code) deepLinkParams.set('code', code);
            if (error) deepLinkParams.set('error', error);
            if (state) deepLinkParams.set('state', state);

            const appDeepLink = 'devotionrun://strava/callback?' + deepLinkParams.toString();
            const universalLink = 'https://devotion.run/strava/callback?' + deepLinkParams.toString();

            // Try to open the app
            if (code) {
                // iOS universal link / custom scheme fallback
                window.location.href = appDeepLink;

                // Fallback message for users on desktop or if app is not installed
                setTimeout(() => {
                    showSuccess(
                        'Authorization code received. If the Devotion.Run app did not open automatically, ' +
                        '<a href="' + appDeepLink + '">tap here to open it</a>.'
                    );
                }, 2500);
            } else if (error) {
                showError(
                    'Strava returned an error: <strong>' + escapeHtml(error) + '</strong>. ' +
                    'Please try connecting again from the Devotion.Run app.'
                );
            } else {
                showError(
                    'No authorization code was found. Please start the connection from the Devotion.Run app.'
                );
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        })();
    </script>
</body>

</html>
