<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectando Strava — Devotion.Run</title>
    <meta name="description" content="Callback OAuth da Strava para o Devotion.Run.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../legal.css">
    <link rel="icon" type="image/png" href="../images/app-icon.png">
</head>

<body>
    <div class="callback-page">
        <div class="callback-card" id="callbackCard">
            <div class="callback-icon" id="callbackIcon">🏃</div>
            <h1 id="callbackTitle">Conectando Strava...</h1>
            <p id="callbackMessage">Aguarde enquanto finalizamos a conexão.</p>
            <div class="callback-spinner" id="callbackSpinner"></div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');
            const state = params.get('state');

            const icon = document.getElementById('callbackIcon');
            const title = document.getElementById('callbackTitle');
            const message = document.getElementById('callbackMessage');
            const spinner = document.getElementById('callbackSpinner');

            const deepLinkParams = new URLSearchParams();
            if (code) deepLinkParams.set('code', code);
            if (error) deepLinkParams.set('error', error);
            if (state) deepLinkParams.set('state', state);

            const appDeepLink = 'devotionrun://strava/callback?' + deepLinkParams.toString();

            function showSuccess(text) {
                spinner.style.display = 'none';
                icon.textContent = '✓';
                title.textContent = 'Strava conectada';
                message.innerHTML = text;
                message.className = 'callback-success';
            }

            function showError(text) {
                spinner.style.display = 'none';
                icon.textContent = '✕';
                title.textContent = 'Falha na conexão';
                message.innerHTML = text;
                message.className = 'callback-error';

                const retryBtn = document.createElement('a');
                retryBtn.href = '/strava/';
                retryBtn.className = 'btn-primary';
                retryBtn.textContent = 'Tentar novamente';
                retryBtn.style.marginTop = '20px';
                document.getElementById('callbackCard').appendChild(retryBtn);
            }

            if (code) {
                window.location.href = appDeepLink;
                setTimeout(() => {
                    showSuccess(
                        'Código de autorização recebido. Se o app Devotion.Run não abrir automaticamente, ' +
                        '<a href="' + appDeepLink + '">toque aqui</a>.'
                    );
                }, 2500);
            } else if (error) {
                showError(
                    'A Strava retornou um erro: <strong>' + escapeHtml(error) + '</strong>. ' +
                    'Por favor, tente conectar novamente pelo app.'
                );
            } else {
                showError(
                    'Nenhum código de autorização encontrado. Inicie a conexão pelo app Devotion.Run.'
                );
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        })();
    </script>
</body>

</html>
